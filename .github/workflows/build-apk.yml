name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Patch manifest and activity
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.VIBRATE"/></manifest>#' $M
          cp patch/MainActivity.java android/app/src/main/java/com/anythinghub/gamepad/MainActivity.java
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gamepad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
